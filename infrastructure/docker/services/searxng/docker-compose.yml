services:
  redis:
    container_name: redis
    image: "redis:alpine"
    command: redis-server --save "" --appendonly "no"
    restart: unless-stopped
    networks:
      - searxng
    tmpfs:
      - /var/lib/redis
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE

  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    networks:
      searxng:
      wirehole_private_network:
        ipv4_address: 10.2.0.52
    ports:
     - "10.2.0.52:8080:8080"
    volumes:
      - "./config:/etc/searxng:rw"
    environment:
      - SEARXNG_BASE_URL=http://10.2.0.52:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

networks:
  searxng:
    ipam:
      driver: default
  wirehole_private_network:
    external: true
