# Docker API filter for aimindmesh-server.
# The server only needs `docker exec` inside the kasm container (KasmValidationService);
# every other Docker API call is refused, so the server never holds the raw socket.
global
    log stdout format raw local0 warning

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    # npm builds inside Kasm workspaces can run for a long time
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend docker_api
    bind :2375

    acl api_ping        path_reg ^(/v[0-9.]+)?/_ping$
    acl api_version     path_reg ^(/v[0-9.]+)?/version$
    acl kasm_inspect    path_reg ^(/v[0-9.]+)?/containers/kasm/json$
    acl kasm_exec       path_reg ^(/v[0-9.]+)?/containers/kasm/exec$
    acl exec_session    path_reg ^(/v[0-9.]+)?/exec/[0-9a-f]{64}/(start|resize)$
    acl exec_inspect    path_reg ^(/v[0-9.]+)?/exec/[0-9a-f]{64}/json$

    http-request allow if METH_GET  api_ping
    http-request allow if { method HEAD } api_ping
    http-request allow if METH_GET  api_version
    http-request allow if METH_GET  kasm_inspect
    http-request allow if METH_POST kasm_exec
    http-request allow if METH_POST exec_session
    http-request allow if METH_GET  exec_inspect
    http-request deny deny_status 403

    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
