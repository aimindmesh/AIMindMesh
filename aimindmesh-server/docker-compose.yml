services:
  aimindmesh-server:
    build: .
    container_name: aimindmesh-server
    restart: always
    env_file: .env
    cap_add:
      - NET_ADMIN
    ports:
      # VPN + localhost only: reach the server through WireGuard, never from the public interface
      - "127.0.0.1:3030:3030"
      - "10.2.0.1:3030:3030"
    environment:
      - OPENCLAW_URL=http://openclaw-gateway:18789
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - GITEA_URL=${GITEA_URL:-http://gitea:3000}
      - GITEA_TOKEN=${GITEA_TOKEN}
      - LOG_LEVEL=info
      # No Docker socket: the CLI talks to docker-proxy, which only allows `docker exec` in kasm
      - DOCKER_HOST=tcp://docker-proxy:2375
    networks:
      wirehole_private_network:
        ipv4_address: 10.2.0.50
      docker_proxy:
    volumes:
      - ./config.json:/app/config.json
      # Must exist on the host before `up`, otherwise Docker creates a directory in its place.
      # Not read-only: backup restore writes it back like config.json
      - ./firebase-service-account.json:/app/firebase-service-account.json
      - ./data:/app/data
      - ./backups:/app/backups
      - ./openclaw-config:/app/openclaw-config
      - ./openclaw-workspace:/app/openclaw-workspace
      # Venture work trees, shared with the agent; their git dirs stay in ./data/ventures (server only)
      - ./venture-workspaces:/app/venture-workspaces
      - ./hermes-data:/app/hermes-data
    depends_on:
      - openclaw-gateway
      - neo4j
      - docker-proxy

  docker-proxy:
    image: haproxy:3.0-alpine
    container_name: aimindmesh-docker-proxy
    restart: unless-stopped
    # Only member of an internal network: reachable by aimindmesh-server alone, no ports published
    networks:
      - docker_proxy
    # Docker socket group on the host
    group_add:
      - "${DOCKER_SOCKET_GID:-126}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock

  neo4j:
    image: neo4j:5.20-community
    container_name: aimindmesh-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "10.2.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
      - "10.2.0.1:7687:7687"
    environment:
      # Only applied when the database is first created; the live password is set with ALTER USER
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - TZ=Europe/Rome
    networks:
      wirehole_private_network:
        ipv4_address: 10.2.0.53
    volumes:
      - ./data/neo4j:/data
      - ./backups/neo4j:/backups

  openclaw-gateway:
    build:
      context: .
      dockerfile: openclaw.Dockerfile
    image: aimindmesh-openclaw-gateway:latest
    container_name: aimindmesh-openclaw-gateway
    restart: unless-stopped
    # No env_file: the agent's shell would see every server secret. Only what openclaw.json and its skills need.
    ports:
      - "127.0.0.1:18789:18789"
      - "10.2.0.1:18789:18789"
    networks:
      wirehole_private_network:
        ipv4_address: 10.2.0.51
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Europe/Rome
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${FREELLMAPI_API_KEY}
      - OPENAI_BASE_URL=http://aimindmesh-server:3030/api/freellmapi-proxy/v1
      - GITEA_URL=${GITEA_URL:-http://gitea:3000}
      # No GITEA_TOKEN: venture repositories are fetched and pushed by the server, never by the agent
      - SEARXNG_BASE_URL=http://10.2.0.52:8080
      - LOG_LEVEL=info
      - PATH=/home/node/.openclaw/tools/sherpa-onnx-tts/runtime/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./openclaw-config:/home/node/.openclaw
      - ./openclaw-workspace:/home/node/.openclaw/workspace
      # A mount point the agent cannot rename or replace with a symlink (see VentureWorkspace)
      - ./venture-workspaces:/home/node/.openclaw/workspace/ventures

  openclaw-cli:
    image: aimindmesh-openclaw-gateway:latest
    container_name: aimindmesh-openclaw-cli
    network_mode: "service:openclaw-gateway"
    profiles: [ "cli" ]
    entrypoint: [ "node", "dist/index.js" ]
    volumes:
      - ./openclaw-config:/home/node/.openclaw

  freellmapi:
    build:
      context: .
      dockerfile: freellmapi.Dockerfile
    container_name: aimindmesh-freellmapi
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - SESSION_SECRET=${FREELLMAPI_SECRET:-aimindmesh-secret-key}
      - DATABASE_PATH=/app/data/freellmapi.db
    networks:
      wirehole_private_network:
        ipv4_address: 10.2.0.54
    volumes:
      - ./data/freellmapi:/app/server/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    networks:
      wirehole_private_network:
        # Fixed like the other services: hermes.gatewayUrl in config.json points here
        ipv4_address: "${HERMES_STATIC_IP:-10.2.0.60}"
    ports:
      - "127.0.0.1:9119:9119"
      - "10.2.0.1:9119:9119"
      - "127.0.0.1:8642:8642"
      - "10.2.0.1:8642:8642"
    volumes:
      - ./hermes-data:/opt/data
    environment:
      - TZ=Europe/Rome
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_DASHBOARD=1
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_KEY}
      # No API_SERVER_CORS_ORIGINS: only the server calls this API (it runs a terminal), never a browser
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${FREELLMAPI_API_KEY}
      - OPENAI_BASE_URL=http://aimindmesh-server:3030/api/freellmapi-proxy/v1
      - GITEA_URL=${GITEA_URL:-http://gitea:3000}
      - SEARXNG_URL=http://10.2.0.52:8080
      - OLLAMA_URL=http://host.docker.internal:11434
      - NEO4J_URI=bolt://neo4j:7687
    command: ["gateway", "run"]

networks:
  wirehole_private_network:
    external: true
  docker_proxy:
    internal: true
