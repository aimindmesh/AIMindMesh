apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.aimindmesh.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aimindmesh.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // Bundled models (assets/bundled_models) stay uncompressed: copied at full speed, and
            // their sizes are known without reading them
            noCompress 'bin', 'onnx', 'zip'
        }
        
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    // Release signing only where the MYAPP_RELEASE_* properties exist (~/.gradle/gradle.properties):
    // debug builds work on any machine and in CI, an unsigned release is produced elsewhere
    def hasReleaseSigning = ['MYAPP_RELEASE_STORE_FILE', 'MYAPP_RELEASE_STORE_PASSWORD',
                             'MYAPP_RELEASE_KEY_ALIAS', 'MYAPP_RELEASE_KEY_PASSWORD'].every { project.hasProperty(it) }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        pickFirst 'lib/x86/libjnidispatch.so'
        pickFirst 'lib/x86_64/libjnidispatch.so'
        pickFirst 'lib/armeabi-v7a/libjnidispatch.so'
        pickFirst 'lib/arm64-v8a/libjnidispatch.so'
        // ONNX Runtime native libs - pick first to avoid duplicate between piper and speaker-embedding
        pickFirst 'lib/arm64-v8a/libonnxruntime.so'
        pickFirst 'lib/x86_64/libonnxruntime.so'
        pickFirst 'lib/armeabi-v7a/libonnxruntime.so'
        pickFirst 'lib/x86/libonnxruntime.so'
        pickFirst '**/libLiteRt*.so'
        pickFirst '**/libLiteRtTopKOpenClSampler.so'
        pickFirst '**/libtensorflowlite_gpu_delegate.so'
        pickFirst '**/libtensorflowlite_gpu_jni.so'
        // libggml*.so come only from the GenieX SDK: whisper links its own ggml statically
        // (a pickFirst here used to replace GenieX's ggml with whisper's older one).
        // OpenMP runtime: shipped by more than one native module
        pickFirst '**/libomp.so'
    }
    // JVM unit tests run on the stubbed android.jar: Log calls return instead of throwing
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

// Resolution strategy removed to allow TFLite Play Services

configurations.all {
    exclude group: 'org.tensorflow', module: 'tensorflow-lite-support-api'
    exclude group: 'org.tensorflow', module: 'tensorflow-lite-api'
    exclude group: 'org.tensorflow', module: 'tensorflow-lite'
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // Encrypted SharedPreferences for secure API key storage (Android Keystore)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    
    // LiteRT-LM for Gemma 4 models
    implementation('com.google.ai.edge.litertlm:litertlm-android:0.11.0')
    
    // Core TFLite GPU Support
    implementation 'com.google.android.gms:play-services-tflite-java:16.5.0'
    implementation 'com.google.android.gms:play-services-tflite-gpu:16.5.0'
    implementation('com.google.android.gms:play-services-tflite-support:16.5.0') {
        exclude group: 'org.tensorflow', module: 'tensorflow-lite-support-api'
    }
    
    // LiteRT Capacitor Plugin
    implementation project(':litert-capacitor')
    
    // Fingerprint / screen-lock check for the app lock (security/AppLockPlugin)
    implementation "androidx.biometric:biometric:1.1.0"

    // ONNX Runtime for TextEmbedding
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.26.0'

    // Sherpa-ONNX per Kokoro TTS v2 (local aar, statically linked to avoid ONNX conflicts).
    // Not versioned in git (38 MB): fetched and SHA-256 checked by aimindmesh-mobile/scripts/fetch-native-deps.sh
    def sherpaAar = file('libs/sherpa-onnx-static-link-onnxruntime-1.13.2.aar')
    if (!sherpaAar.exists()) {
        throw new GradleException("Missing ${sherpaAar}: run aimindmesh-mobile/scripts/fetch-native-deps.sh")
    }
    implementation files(sherpaAar)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // Periodic proactive checks that survive background limits (proactive/ProactiveWorker.kt)
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    // Real org.json on the JVM for unit tests (the Android one is a stub there)
    testImplementation 'org.json:json:20240303'
    implementation 'org.apache.commons:commons-compress:1.26.1'

    // Firebase Cloud Messaging (v4.0.0 — push notifications for Feed/insights)
    implementation 'com.google.firebase:firebase-messaging:24.0.0'

    // FCM Capacitor Plugin (v4.0.0)
    implementation project(':fcm-capacitor')

    // Qualcomm Genie NPU Plugin
    implementation project(':genie-capacitor')

    // Qualcomm Stable Diffusion NPU Plugin
    implementation project(':sd-capacitor')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
